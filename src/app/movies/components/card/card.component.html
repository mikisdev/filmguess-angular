<div
  class="w-52 h-auto p-4 m-2 rounded-lg shadow-md hover:shadow-lg hover:scale-110 transition-transform cursor-pointer group"
>
  <div class="relative inline-block">
    <mat-icon
      *ngIf="isRemovable"
      class="text-violet-700 absolute top-2 right-2 hover:text-red-800"
      (click)="removeMovie()"
      >delete</mat-icon
    >
    <img
      [src]="movie.poster_path | imagePatch"
      [alt]="movie.title"
      class="rounded-lg h-64 block"
      [routerLink]="['/movies', movie.id]"
    />
  </div>
  <div class="p-3 flex flex-col gap-5" [routerLink]="['/movies', movie.id]">
    <span class="text-lg font-semibold text-balance">{{ movie.title }}</span>

    <div class="flex-col gap-5">
      <div class="flex justify-between">
        <span class="text-sm text-slate-500">Estreno</span>
        <p class="text-sm text-white">{{ movie.release_date | date : 'MM/dd/yyyy' }}</p>
      </div>
      <div class="flex justify-between">
        <span class="text-sm text-slate-500">Valoración</span>
        <p class="text-sm text-white">{{ movie.vote_average / 10 | percent }}</p>
      </div>
    </div>
  </div>
</div>
